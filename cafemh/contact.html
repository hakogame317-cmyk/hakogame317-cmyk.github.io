<div id="contact">

<h2>Contact<br><span>お問い合わせ</span></h2>
	
<form action="#" method="post" class="contact-form">
	
<p class="form-note"><span class="required">※</span>印は必須項目です</p>
	
<div id="form-group">
	
	<div class="form-group">		
	<p>お問い合わせ項目<span class="required">※</span></p>
	<select name="inquiry_type" class="form-control">
		<option value="">選択してください</option>
		<option value="menu">メニューについて</option>
		<option value="afternoontea">アフタヌーンティーについて</option>
		<option value="access">アクセスについて</option>
		<option value="other">その他</option>
	</select></div>
	
	<div class="form-group">
	<p>お名前<span class="required">※</span></p>
	<input type="text" name="name" value="" placeholder="入力してください" class="form-control" required></div>
	
	<div class="form-group">
	<p>フリガナ<span class="required">※</span></p>
	<input type="text" name="kana" value="" placeholder="入力してください" class="form-control" required></div>
	
	<div class="form-group">
	<p>性別</p>
	<label class="radio-item">
	<input type="radio" name="gender" value="1">男性</label>
	<label class="radio-item">
	<input type="radio" name="gender" value="2">女性</label>
	<label class="radio-item">
	<input type="radio" name="gender" value="3">その他</label>
	</div>
	
	<div class="form-group">
	<p>年代</p>
	<label class="radio-item">
	<input type="radio" name="age" value="1">～10代</label>
	<label class="radio-item">
	<input type="radio" name="age" value="2">20代</label>
	<label class="radio-item">
	<input type="radio" name="age" value="3">30代</label>
	<label class="radio-item">
	<input type="radio" name="age" value="4">40代</label>
	<label class="radio-item">
	<input type="radio" name="age" value="5">50代～</label>
	</div>
	
	<div class="form-group">
	<p>電話番号<span class="required">※</span></p>
	<input type="tel" name="tel" value="" placeholder="入力してください" class="form-control" required></div>
	
	<div class="form-group">
	<p>メールアドレス<span class="required">※</span></p>
	<input type="email" name="email" value="" placeholder="入力してください" class="form-control" required></div>
	
	<div class="form-group">
		<p>お問い合わせ内容<span class="required">※</span><br><span class="note">（500文字以内）</span></p>
	<textarea name="text" placeholder="入力してください" maxlength="500" required></textarea>		
	</div>
	
</div>
	
<div class="agreement"><input type="checkbox" name="agreement" required>プライバシーポリシーに同意します。</div>
	
<button type="submit" class="btn">入力内容確認　▷</button>

</form>
